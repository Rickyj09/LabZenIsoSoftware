name: labzeniso-onlyoffice

services:
  onlyoffice-document-server:
    image: onlyoffice/documentserver:8.2.2
    container_name: labzeniso-onlyoffice-document-server
    restart: unless-stopped
    ports:
      - "${ONLYOFFICE_PORT:-8082}:80"
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: "${ONLYOFFICE_JWT_SECRET:?ONLYOFFICE_JWT_SECRET is required}"
      JWT_HEADER: Authorization
      JWT_IN_BODY: "true"
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_log:/var/log/onlyoffice
      - onlyoffice_lib:/var/lib/onlyoffice
      - onlyoffice_db:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - onlyoffice_net

networks:
  onlyoffice_net:
    name: labzeniso_onlyoffice_net
    driver: bridge

volumes:
  onlyoffice_data:
  onlyoffice_log:
  onlyoffice_lib:
  onlyoffice_db:
