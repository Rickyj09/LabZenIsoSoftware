<header class="topbar">

    <!-- LADO IZQUIERDO -->
    <div class="d-flex flex-column">
        <span class="text-muted small">Panel administrativo</span>
        <span class="fw-semibold" style="color: var(--lz-primary-dark);">
            LabZenISO Software
        </span>
    </div>

    <!-- LADO DERECHO -->
    <div class="d-flex align-items-center gap-3">

        <!-- Usuario -->
        <div class="d-flex align-items-center gap-2 px-2 py-1 rounded-pill"
             style="background: #F1F6FB; border: 1px solid var(--lz-border);">

            <!-- Avatar -->
            <div style="
                width: 32px;
                height: 32px;
                border-radius: 50%;
                background: linear-gradient(135deg, var(--lz-primary), var(--lz-primary-light));
                display: flex;
                align-items: center;
                justify-content: center;
                color: white;
                font-weight: 700;
                font-size: 0.85rem;
            ">
                {{ current_user.nombre[0] if current_user.nombre else 'U' }}
            </div>

            <!-- Nombre -->
            <div class="d-flex flex-column" style="line-height: 1;">
                <span style="font-size: 0.85rem; font-weight: 600;">
                    {{ current_user.nombre }} {{ current_user.apellido }}
                </span>
                <span class="text-muted" style="font-size: 0.75rem;">
                    {{ current_user.email }}
                </span>
            </div>
        </div>

        <!-- Botón logout -->
        <a href="{{ url_for('web_auth.logout') }}"
           class="btn btn-outline-primary btn-sm d-flex align-items-center gap-1">

            <!-- Ícono simple -->
            <span style="font-size: 0.9rem;">⎋</span>
            <span>Cerrar sesión</span>
        </a>

    </div>
</header>
