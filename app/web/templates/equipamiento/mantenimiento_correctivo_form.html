{% extends "base_admin.html" %}
{% block title %}Nuevo correctivo{% endblock %}

{% block content %}
<nav aria-label="breadcrumb" class="mb-3"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="{{ url_for('equipamiento.dashboard') }}">Instalaciones y Equipamiento</a></li><li class="breadcrumb-item"><a href="{{ url_for('equipamiento.mantenimientos') }}">Mantenimientos</a></li><li class="breadcrumb-item active">Nuevo correctivo</li></ol></nav>
<div class="page-card">
    <h1 class="mb-4">Nuevo mantenimiento correctivo</h1>
    <form method="post" class="row g-3">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="col-md-6"><label class="form-label">Equipo</label><select name="equipo_id" class="form-select" required><option value="">Selecciona equipo</option>{% for equipo in equipos %}<option value="{{ equipo.id }}" {% if form_data.equipo_id|string == equipo.id|string %}selected{% endif %}>{{ equipo.codigo }} - {{ equipo.nombre }}</option>{% endfor %}</select></div>
        <div class="col-md-3"><label class="form-label">Fecha planificada</label><input type="date" name="fecha_planificada" class="form-control" value="{{ form_data.fecha_planificada or '' }}" required></div>
        <div class="col-md-3"><label class="form-label">Responsable</label><select name="responsable_id" class="form-select"><option value="">Sin responsable</option>{% for user in responsables %}<option value="{{ user.id }}" {% if form_data.responsable_id|string == user.id|string %}selected{% endif %}>{{ user.nombre }} {{ user.apellido }}</option>{% endfor %}</select></div>
        <div class="col-md-6"><label class="form-label">Proveedor</label><input name="proveedor" class="form-control" value="{{ form_data.proveedor or '' }}"></div>
        <div class="col-md-6"><label class="form-label">Observaciones</label><input name="observaciones" class="form-control" value="{{ form_data.observaciones or '' }}"></div>
        <div class="col-12"><label class="form-label">Descripcion del problema o trabajo</label><textarea name="descripcion_trabajo" class="form-control" rows="4" required>{{ form_data.descripcion_trabajo or '' }}</textarea></div>
        <div class="col-12 d-flex gap-2"><button class="btn btn-primary">Guardar</button><a href="{{ url_for('equipamiento.mantenimientos') }}" class="btn btn-outline-secondary">Cancelar</a></div>
    </form>
</div>
{% endblock %}
