{% extends "base_admin.html" %}
{% block title %}{% if item %}Editar método{% else %}Nuevo método{% endif %}{% endblock %}

{% block content %}
<div class="page-card">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="mb-1">{% if item %}Editar método{% else %}Nuevo método{% endif %}</h1>
            <p class="text-muted mb-0">Administración del catálogo de métodos</p>
        </div>
        <div>
            <a href="{{ url_for('metodos.index') }}" class="btn btn-outline-secondary">
                Volver
            </a>
        </div>
    </div>

    <form method="post">
        <div class="row g-3">
            <div class="col-md-3">
                <label class="form-label">Código</label>
                <input type="text" name="codigo" class="form-control"
                       value="{{ item.codigo if item else '' }}" required>
            </div>

            <div class="col-md-5">
                <label class="form-label">Nombre</label>
                <input type="text" name="nombre" class="form-control"
                       value="{{ item.nombre if item else '' }}" required>
            </div>

            <div class="col-md-2">
                <label class="form-label">Versión</label>
                <input type="text" name="version" class="form-control"
                       value="{{ item.version if item else '' }}">
            </div>

            <div class="col-md-2">
                <label class="form-label">Tipo</label>
                <input type="text" name="tipo" class="form-control"
                       value="{{ item.tipo if item else '' }}"
                       placeholder="Interno / externo">
            </div>

            <div class="col-md-6">
                <label class="form-label">Norma de referencia</label>
                <input type="text" name="norma_referencia" class="form-control"
                       value="{{ item.norma_referencia if item else '' }}"
                       placeholder="ISO, EPA, SM...">
            </div>

            <div class="col-md-3">
                <label class="form-label">Fecha de vigencia</label>
                <input type="date" name="fecha_vigencia" class="form-control"
                       value="{{ item.fecha_vigencia if item else '' }}">
            </div>

            <div class="col-md-3">
                <div class="form-check mt-4">
                    <input class="form-check-input" type="checkbox" name="activo" id="activo"
                           {% if not item or item.activo %}checked{% endif %}>
                    <label class="form-check-label" for="activo">
                        Activo
                    </label>
                </div>
            </div>

            <div class="col-md-12">
                <label class="form-label">Descripción</label>
                <textarea name="descripcion" class="form-control" rows="4">{{ item.descripcion if item else '' }}</textarea>
            </div>
        </div>

        <hr class="my-4">

        <div class="d-flex justify-content-end gap-2">
            <a href="{{ url_for('metodos.index') }}" class="btn btn-outline-secondary">
                Cancelar
            </a>
            <button type="submit" class="btn btn-primary">
                {% if item %}Actualizar método{% else %}Guardar método{% endif %}
            </button>
        </div>
    </form>
</div>
{% endblock %}
