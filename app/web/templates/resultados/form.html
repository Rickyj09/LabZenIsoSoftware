{% extends "base_admin.html" %}

{% block title %}Resultado{% endblock %}

{% block content %}

<div class="page-card">

<h1>
{% if item %}Editar Resultado{% else %}Nuevo Resultado{% endif %}
</h1>

<form method="post">

<div class="row g-3">

<div class="col-md-4">
<label>Parámetro</label>
<input type="text" name="parametro"
class="form-control"
value="{{ item.parametro if item else '' }}"
required>
</div>

<div class="col-md-4">
<label>Valor</label>
<input type="text" name="valor"
class="form-control"
value="{{ item.valor if item else '' }}">
</div>

<div class="col-md-4">
<label>Unidad</label>
<input type="text" name="unidad"
class="form-control"
value="{{ item.unidad if item else '' }}">
</div>

<div class="col-md-3">
<label>Límite mínimo</label>
<input type="number" step="0.01"
name="limite_min"
class="form-control"
value="{{ item.limite_min if item else '' }}">
</div>

<div class="col-md-3">
<label>Límite máximo</label>
<input type="number" step="0.01"
name="limite_max"
class="form-control"
value="{{ item.limite_max if item else '' }}">
</div>

<div class="col-md-3">

<div class="form-check mt-4">

<input class="form-check-input"
type="checkbox"
name="conforme"
{% if item and item.conforme %}checked{% endif %}>

<label class="form-check-label">
Conforme
</label>

</div>

</div>

<div class="col-md-12">

<label>Observaciones</label>

<textarea name="observaciones"
class="form-control"
rows="3">

{{ item.observaciones if item else '' }}

</textarea>

</div>

</div>

<br>

<button class="btn btn-primary">
Guardar
</button>

<a href="{{ url_for('resultados.index', muestra_ensayo_id=muestra_ensayo.id) }}"
class="btn btn-secondary">
Cancelar
</a>

</form>

</div>

{% endblock %}
