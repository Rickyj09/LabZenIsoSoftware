{% extends "base_admin.html" %}

{% block title %}{{ 'Editar personal' if item else 'Nuevo personal' }}{% endblock %}

{% block content %}
{% set data = form_data %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">{{ 'Editar personal' if item else 'Nuevo personal' }}</h3>
        <a class="btn btn-outline-secondary" href="{{ url_for('personal.index') }}">Volver</a>
    </div>

    <form method="post" class="row g-3">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="col-md-3">
            <label class="form-label" for="codigo">Codigo interno</label>
            <input class="form-control" id="codigo" name="codigo" required value="{{ data.get('codigo', item.codigo if item else '') }}">
        </div>
        <div class="col-md-4">
            <label class="form-label" for="nombres">Nombres</label>
            <input class="form-control" id="nombres" name="nombres" required value="{{ data.get('nombres', item.nombres if item else '') }}">
        </div>
        <div class="col-md-5">
            <label class="form-label" for="apellidos">Apellidos</label>
            <input class="form-control" id="apellidos" name="apellidos" required value="{{ data.get('apellidos', item.apellidos if item else '') }}">
        </div>
        <div class="col-md-3">
            <label class="form-label" for="identificacion">Identificacion</label>
            <input class="form-control" id="identificacion" name="identificacion" value="{{ data.get('identificacion', item.identificacion if item else '') }}">
        </div>
        <div class="col-md-4">
            <label class="form-label" for="email">Correo</label>
            <input class="form-control" id="email" name="email" type="email" value="{{ data.get('email', item.email if item else '') }}">
        </div>
        <div class="col-md-3">
            <label class="form-label" for="telefono">Telefono</label>
            <input class="form-control" id="telefono" name="telefono" value="{{ data.get('telefono', item.telefono if item else '') }}">
        </div>
        <div class="col-md-2">
            <label class="form-label" for="estado">Estado</label>
            <select class="form-select" id="estado" name="estado">
                {% for estado in estados_personal %}
                {% set selected_estado = data.get('estado', item.estado if item else 'ACTIVO') %}
                <option value="{{ estado }}" {% if selected_estado == estado %}selected{% endif %}>{{ estado }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-5">
            <label class="form-label" for="cargo_id">Cargo</label>
            <select class="form-select" id="cargo_id" name="cargo_id" required>
                <option value="">Seleccione...</option>
                {% for cargo in cargos %}
                {% set selected_cargo = data.get('cargo_id', item.cargo_id|string if item else '') %}
                <option value="{{ cargo.id }}" {% if selected_cargo == cargo.id|string %}selected{% endif %}>{{ cargo.codigo }} - {{ cargo.nombre }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-5">
            <label class="form-label" for="usuario_id">Usuario asociado</label>
            <select class="form-select" id="usuario_id" name="usuario_id">
                <option value="">Sin acceso al sistema</option>
                {% for usuario in usuarios %}
                {% set selected_user = data.get('usuario_id', item.usuario_id|string if item and item.usuario_id else '') %}
                <option value="{{ usuario.id }}" {% if selected_user == usuario.id|string %}selected{% endif %}>{{ usuario.nombre }} {{ usuario.apellido }} - {{ usuario.email }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-3">
            <label class="form-label" for="fecha_ingreso">Fecha ingreso</label>
            <input class="form-control" id="fecha_ingreso" name="fecha_ingreso" type="date" value="{{ data.get('fecha_ingreso', item.fecha_ingreso.isoformat() if item and item.fecha_ingreso else '') }}">
        </div>
        <div class="col-md-3">
            <label class="form-label" for="fecha_salida">Fecha salida</label>
            <input class="form-control" id="fecha_salida" name="fecha_salida" type="date" value="{{ data.get('fecha_salida', item.fecha_salida.isoformat() if item and item.fecha_salida else '') }}">
        </div>
        <div class="col-12">
            <label class="form-label" for="observaciones">Observaciones</label>
            <textarea class="form-control" id="observaciones" name="observaciones" rows="3">{{ data.get('observaciones', item.observaciones if item else '') }}</textarea>
        </div>
        <div class="col-12 d-flex gap-2">
            <button class="btn btn-primary" type="submit">Guardar</button>
            <a class="btn btn-outline-secondary" href="{{ url_for('personal.index') }}">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
